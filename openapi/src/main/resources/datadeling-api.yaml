openapi: 3.0.0
info:
  title: Datadeling API
  version: 1.0.0

  description: |
    Tjenesten vil hente perioder personen har hatt dagpengerettighet av følgende varianter:
    * Ordinær dagpengerettighet for arbeidsledige
    * Dagpenger under permittering
    * Dagpenger under permittering fra fiskeindustrien
    
    Undervarianter av disse rettighetene vil også inkluderes:
    * Personer som har dagpenger på bakgrunn av vernepliktregelen (verneplikt tre av de siste tolv måneder)
    * Personer som har dagpenger på bakgrunn av lærlingeregelverket under koronapandemien
    
    Tjenesten vil ikke hente vedtak med informasjon om
    * Rett til forskutterte lønnsgarantimidler utbetalt som dagpenger
    * Rett til å ta med dagpengene til utlandet
    * Sanksjonsvedtak (forlenget ventetid eller tidsbegrenset bortfall – medfører at personen ikke får utbetaling i en periode)
    * Annullering av sanksjon
    
    Tjenesten vil hente perioder der personen har hatt vedtak om rett til dagpenger, selv om personen ikke har fått 
    utbetaling i hele/deler av perioden grunnet sanksjonsvedtak.
    
    Tjenesten vil hente perioder der personen har hatt vedtak om rett til dagpenger, selv om personen har hatt 
    enkeltdager eller meldeperioder uten rett til utbetaling, for eksempel grunnet arbeid over terskel for tapt 
    arbeidstid eller enkeltdager med fravær eller sykdom.
    
    Det er en utfordring med datakvaliteten, ved at endringer med tilbakevirkende kraft ikke reflekteres. Dataene som 
    utleveres tar ikke hensyn til eventuelle feilutbetalingssaker. Der en feilutbetalingssak har resultert i omgjøring 
    av vedtaksperioden, blir ikke dette reflektert i dataene som utleveres. Dette gjelder både for ferdig behandlede 
    feilutbetalingssaker og eventuelle etterfølgende feilutbetalingssaker. Vedtaksperiodene er dermed ikke nødvendigvis 
    korrekte. Det er imidlertid sjeldent at en feilutbetalingssak får betydning for vedtaksperiode, og det vil berøre 
    et lite antall saker.
    
    Tjenesten vil også hente beregnede perioder fra arena og dp-sak, og kombinere disse til en liste med beregningsdetaljer for dagpenger. 
    Disse detaljene inkluderer blant annet innvilget dagsats, utbetalt brutto beløp, gjenstående dager, og kilde for beregningen (Arena eller DP-sak).
    Arena gir beregnede perioder mens dp-sak gir enkeltdager.

servers:
  - url: https://dp-datadeling.intern.dev.nav.no
    description: dev for interne
  - url: https://dp-datadeling.ekstern.dev.nav.no
    description: dev for eksterne
  - url: https://www.nav.no
    description: prod
tags:
  - name: Eksternt
    description: API for datadeling av dagpengerettigheter til eksterne systemer (Utenfor Nav)
  - name: Internt
    description: API for datadeling av dagpengerettigheter til interne systemer (Innenfor Nav)
  - name: Rettighetsperioder
    description: API for å hente rettighetsperioder for dagpenger
  - name: Beregninger
    description: API for å hente beregningsdetaljer for dagpenger
  - name: Meldekort
    description: API for å hente meldekort for dagpenger
  - name: Sak
    description: API for å hente saker med status, søknader og rettighetsperioder for dagpenger
  - name: Dagpengestatus
    description: API for overlappskontroll — om en person er i ny dagpengeløsning (DP-sak)


paths:
  /dagpenger/datadeling/v1/periode:
    post:
      description: |-
        Opprett ny ressurs basert på innsendte data, returnerer URL til opprettede ressursen
        
        Scope: `nav:dagpenger:afpprivat.read`
      tags:
        - Eksternt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatadelingRequest'
      responses:
        201:
          description: Created
          content:
            text/plain:
              schema:
                type: string
                description: En url man kaller for å få svar på hvilke perioder en person har hatt retten til dagpenger
      security:
        - maskinporten: [ ]
    get:
      description: |-
        Hent informasjon eksisterende ressurs ved hjelp av ressursens UUID
        
        Scope: `nav:dagpenger:afpprivat.read`
      tags:
        - Eksternt
      parameters:
        - in: path
          name: ressursUuid
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ressurs'
      security:
        - maskinporten: [ ]
  /dagpenger/datadeling/v1/perioder:
    post:
      description: |-
        Perioder er såkalte betingede perioder (rettighetsperioder) for Dagpenger. Bruker har rett til Dagpenger i disse periodene 
         gitt at andre betingelser er oppfylt (Melder seg til Nav hver 14. dag pt).
      tags:
        - Internt
        - Rettighetsperioder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatadelingRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatadelingResponse'
      security:
        - azure: [ ]

  /dagpenger/datadeling/v1/beregninger:
    post:
      description: |-
        Returnerer brutto beregnet beløp basert på beregnede meldeperioder fra både Arena og dp-sak.
        Dataene kombineres og sorteres kronologisk.
      tags:
        - Internt
        - Beregninger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatadelingRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BeregnetDag'
      security:
        - azure: [ ]

  /dagpenger/datadeling/v1/dagpengestatus:
    post:
      summary: Dagpengestatus i ny løsning
      description: |-
        Returnerer om en person er i ny dagpengeløsning (DP-sak), og fra når.
        Brukes av Arena for overlappskontroll ved behandling av dagpenger.

        Dersom personen ikke finnes i ny løsning returneres forsteDato som null.
      tags:
        - Internt
        - Dagpengestatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DagpengestatusRequest'
      responses:
        200:
          description: Dagpengestatus for personen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DagpengestatusResponse'
      security:
        - azure: [ ]

  /dagpenger/datadeling/v1/meldekort:
    post:
      description: |-
        Returnerer meldekort basert på innsendte data
      tags:
        - Internt
        - Meldekort
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatadelingRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Meldekort'
      security:
        - azure: [ ]

  /dagpenger/datadeling/v1/saker:
    post:
      description: |-
        Lister alle saker for en person. Responsen er tynn som standard;
        bruk `include` for å ta med meldekort, beregninger og/eller opplysninger.
      tags:
        - Internt
        - Sak
      parameters:
        - name: include
          in: query
          required: false
          style: form
          explode: false
          description: Kommaseparert liste over relaterte data som skal tas med i svaret. Uten dette returneres kun sakId, status og statusens egne felt.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/SakInkluder'
        - name: dato
          in: query
          required: false
          description: |-
            Kun for `include=opplysninger`. Uten dato returneres alle periodene til hver opplysning.
            Med dato returneres én verdi per opplysning, den som gjelder på datoen (`null` hvis ingen verdi gjelder).
            Har ingen effekt uten `include=opplysninger`.
          schema:
            type: string
            format: date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatadelingRequest'
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sak'
      security:
        - azure: [ ]

  /dagpenger/datadeling/v1/saker/{sakId}:
    get:
      description: |-
        Henter én sak. Svaret er tynt som standard;
        bruk `include` for å ta med meldekort, beregninger og/eller opplysninger.
      tags:
        - Internt
        - Sak
      parameters:
        - name: sakId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SakId'
        - name: include
          in: query
          required: false
          style: form
          explode: false
          description: Kommaseparert liste over relaterte data som skal tas med i svaret. Uten dette returneres kun sakId, status og statusens egne felt.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/SakInkluder'
        - name: dato
          in: query
          required: false
          description: |-
            Kun for `include=opplysninger`. Uten dato returneres alle periodene til hver opplysning.
            Med dato returneres én verdi per opplysning, den som gjelder på datoen (`null` hvis ingen verdi gjelder).
            Har ingen effekt uten `include=opplysninger`.
          schema:
            type: string
            format: date
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sak'
        404:
          description: Saken finnes ikke
      security:
        - azure: [ ]


components:
  schemas:
    # TODO: Bruke openapi genererte objekter. Objektene kommer fra dp-kontrakter, ikke autogenerert som vi burde

    DatadelingRequest:
      type: object
      required:
        - personIdent
        - fraOgMedDato
      properties:
        personIdent:
          type: string
          description: Personens fødselsnummer eller D-nummer
        fraOgMedDato:
          type: string
          format: date
          description: Tidligste dato man trenger informasjon om dagpengerettighet. Perioder som er gyldige på denne dato vil bli med i responsen, selv om de starter tidligere. Perioder som starter senere enn denne dato vil bli med i responsen hvis de ikke begrenses av tilOgMedDato (se beskrivelse under).
        tilOgMedDato:
          type: string
          format: date
          description: Seneste dato man trenger informasjon om dagpengerettighet. Perioder som er gyldige på denne dato vil bli med i responsen, selv om de slutter senere. Perioder med åpen til-dato vil bli med i responsen hvis de er gyldige på gitt tilOgMedDato.

    Ressurs:
      type: object
      required:
        - uuid
        - status
      properties:
        uuid:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RessursStatus'
        response:
          $ref: '#/components/schemas/DatadelingResponseAfp'

    RessursStatus:
      type: string
      enum:
        - OPPRETTET
        - FERDIG
        - FEILET


    DatadelingResponseAfp:
      type: object
      required:
        - personIdent
        - perioder
      properties:
        personIdent:
          type: string
          description: Personens fødselsnummer eller D-nummer
        perioder:
          type: array
          description: Liste med perioder bruker har hatt retten til dagpenger. Kan være en tom liste.
          items:
            $ref: '#/components/schemas/PeriodeAfp'

    DatadelingResponse:
      type: object
      required:
        - personIdent
        - perioder
      properties:
        personIdent:
          type: string
          description: Personens fødselsnummer eller D-nummer
        perioder:
          type: array
          description: Liste med perioder bruker har hatt retten til dagpenger. Kan være en tom liste.
          items:
            $ref: '#/components/schemas/Periode'

    PeriodeAfp:
      type: object
      required:
        - fraOgMedDato
        - ytelseType
      properties:
        fraOgMedDato:
          type: string
          format: date
          description: Første dato ytelsen gjelder. Dersom ytelsen startet tidligere enn requestens fraOgMedDato, vil requestens fraOgMedDato benyttes.
        tilOgMedDato:
          type: string
          format: date
          description: Siste dato ytelsen gjelder. Hvis elementet er tomt eller ikke er angitt, er ytelsen fortsatt aktiv.
        ytelseType:
          $ref: '#/components/schemas/YtelseType'

    Periode:
      type: object
      required:
        - fraOgMedDato
        - ytelseType
        - kilde
      properties:
        fraOgMedDato:
          type: string
          format: date
          description: Første dato ytelsen gjelder. Dersom ytelsen startet tidligere enn requestens fraOgMedDato, vil requestens fraOgMedDato benyttes.
        tilOgMedDato:
          type: string
          format: date
          description: Siste dato ytelsen gjelder. Hvis elementet er tomt eller ikke er angitt, er ytelsen fortsatt aktiv.

        kilde:
          $ref: '#/components/schemas/Fagsystem'

        ytelseType:
          $ref: '#/components/schemas/YtelseType'

    Fagsystem:
      type: string
      enum:
        - ARENA
        - DP_SAK

    YtelseType:
      type: string
      description: Type ytelse som gjelder i perioden.
      enum:
        - DAGPENGER_ARBEIDSSOKER_ORDINAER
        - DAGPENGER_PERMITTERING_ORDINAER
        - DAGPENGER_PERMITTERING_FISKEINDUSTRI

    Meldekort:
      type: object
      required:
        - id
        - ident
        - status
        - periode
        - dager
        - kanSendes
        - kanEndres
        - kanSendesFra
        - sisteFristForTrekk
        - opprettetAv
        - type
      properties:
        id:
          type: string
        ident:
          type: string
          description: Ident til dagpengebruker
        status:
          type: string
          enum: [ TilUtfylling, Innsendt ]
        type:
          type: string
          enum: [ Ordinaert, Korrigert, Etterregistrert ]
        periode:
          $ref: '#/components/schemas/MeldekortPeriode'
        dager:
          type: array
          items:
            $ref: '#/components/schemas/Dag'
        kanSendes:
          type: boolean
        kanEndres:
          type: boolean
        kanSendesFra:
          type: string
          format: date
        sisteFristForTrekk:
          type: string
          format: date
        opprettetAv:
          $ref: '#/components/schemas/OpprettetAv'
        # Kun relevant ved korrigering eller innsending av saksbehandler
        originalMeldekortId:
          type: string
        begrunnelse:
          type: string
        # Kun relevant ved Innsendt
        kilde:
          $ref: '#/components/schemas/MeldekortKilde'
        innsendtTidspunkt:
          type: string
          format: date-time
        registrertArbeidssoker:
          type: boolean
        meldedato:
          type: string
          format: date

    MeldekortPeriode:
      type: object
      required: [ fraOgMed, tilOgMed ]
      properties:
        fraOgMed:
          type: string
          format: date
        tilOgMed:
          type: string
          format: date

    Dag:
      type: object
      required: [ dato, aktiviteter, dagIndex ]
      properties:
        dato:
          type: string
          format: date
        aktiviteter:
          type: array
          items:
            $ref: '#/components/schemas/Aktivitet'
        dagIndex:
          type: integer

    Aktivitet:
      type: object
      required: [ id, type ]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [ Arbeid, Syk, Utdanning, Fravaer ]
        timer:
          type: string
          nullable: true

    OpprettetAv:
      type: string
      enum: [ Arena, Dagpenger ]

    MeldekortKilde:
      type: object
      description: Eksempelvis Bruker eller Saksbehandler
      required: [ rolle, ident ]
      properties:
        rolle:
          type: string
          enum: [ Bruker, Saksbehandler ]
        ident:
          type: string

    StonadType:
      type: string
      description: Stønadstype
      enum:
        - DAGPENGER_ARBEIDSSOKER_ORDINAER
        - DAGPENGER_PERMITTERING_ORDINAER
        - DAGPENGER_PERMITTERING_FISKEINDUSTRI

    BeregnetDag:
      type: object
      required:
        - fraOgMed
        - tilOgMed
        - sats
        - utbetaltBeløp
        - gjenståendeDager
        - kilde
      properties:
        fraOgMed:
          type: string
          format: date
        tilOgMed:
          type: string
          format: date
        sats:
          type: integer
          description: Innvilget dagpengesats for perioden. Dette er inklusiv barnetillegg og eventuelt redusert etter samordning
          format: int32
        utbetaltBeløp:
          type: integer
          description: Viser brutto beregnet for perioden som er oversendt til utbetaling. Denne kan være gradert etter timer arbeidet, syk eller fravær som er meldt i meldekort
          format: int32
        gjenståendeDager:
          description: Viser gjenstående dager med dagpengerettighet etter denne perioden.
          type: integer
        kilde:
          $ref: '#/components/schemas/Fagsystem'

    DagpengestatusRequest:
      type: object
      required:
        - personIdent
      properties:
        personIdent:
          type: string
          description: Personens fødselsnummer eller D-nummer

    DagpengestatusResponse:
      type: object
      required:
        - personIdent
      properties:
        personIdent:
          type: string
          description: Personens fødselsnummer eller D-nummer
        forsteDato:
          type: string
          format: date
          nullable: true
          description: >-
            Første dato personen har en dagpengesak i ny løsning.
            Null dersom personen ikke finnes i ny løsning.
            Denne datoen angir fra når personen ikke lenger skal
            behandles for dagpenger i Arena.

    SakId:
      type: string
      format: uuid

    SakInkluder:
      type: string
      enum:
        - meldekort
        - beregninger
        - opplysninger

    Sak:
      description: En sak, det vil si en sammenhengende behandlingskjede. Diskriminert på `status`.
      oneOf:
        - $ref: '#/components/schemas/SakTilBehandling'
        - $ref: '#/components/schemas/SakLoepende'
        - $ref: '#/components/schemas/SakAvsluttet'
      discriminator:
        propertyName: status
        mapping:
          TilBehandling: '#/components/schemas/SakTilBehandling'
          Løpende: '#/components/schemas/SakLoepende'
          Avsluttet: '#/components/schemas/SakAvsluttet'

    Soknad:
      description: En søknad om dagpenger i saken. Tilstand går fra Innsendt via UnderBehandling til Ferdig eller Avbrutt.
      type: object
      required:
        - soknadId
        - innsendt
        - tilstand
      properties:
        soknadId:
          type: string
          format: uuid
        innsendt:
          description: Tidspunktet søknaden ble innsendt
          type: string
          format: date-time
        tilstand:
          $ref: '#/components/schemas/SoknadTilstand'
        utfall:
          description: Hva søknadsbehandlingen førte til (for eksempel Innvilgelse). Kun når tilstand er Ferdig.
          type: string

    SoknadTilstand:
      type: string
      enum:
        - Innsendt
        - UnderBehandling
        - Ferdig
        - Avbrutt

    SakBase:
      type: object
      required:
        - sakId
      properties:
        sakId:
          $ref: '#/components/schemas/SakId'
        soknader:
          description: Søknader i saken (nyeste først)
          type: array
          items:
            $ref: '#/components/schemas/Soknad'
        meldekort:
          description: Meldekort i saken (nyeste først). Kun med include=meldekort
          type: array
          items:
            $ref: '#/components/schemas/Meldekort'

    SakTilBehandling:
      description: Saken har ingen rettighetsperiode (ennå). Gjelder også saker uten behandlingsresultat og saker som ikke ga rett til dagpenger. Se soknader for søknadenes tilstand.
      allOf:
        - $ref: '#/components/schemas/SakBase'
        - type: object
          required:
            - status
          properties:
            status:
              type: string
              enum: [TilBehandling]

    SakLoepende:
      description: Bruker har løpende rett på dagpenger
      allOf:
        - $ref: '#/components/schemas/SakBase'
        - type: object
          required:
            - status
            - rettighetsperioder
            - sistEndret
          properties:
            status:
              type: string
              enum: [Løpende]
            rettighetsperioder:
              description: Alle rettighetsperioder i saken, sortert på fraOgMed, inkludert perioder uten rett (pause)
              type: array
              items:
                $ref: '#/components/schemas/Rettighetsperiode'
            opplysninger:
              description: Periodiserte opplysninger. Kun med include=opplysninger
              $ref: '#/components/schemas/Opplysninger'
            beregninger:
              description: Beregninger per dag. Kun med include=beregninger
              type: array
              items:
                $ref: '#/components/schemas/BeregnetDag'
            sisteMeldeperiode:
              $ref: '#/components/schemas/LukketPeriode'
            gjenstående:
              $ref: '#/components/schemas/Gjenstaaende'
            sistEndret:
              description: Tidspunktet siste ferdigstilte behandling i saken ble ferdig
              type: string
              format: date-time

    SakAvsluttet:
      description: Rettigheten er avsluttet
      allOf:
        - $ref: '#/components/schemas/SakBase'
        - type: object
          required:
            - status
            - rettighetsperioder
            - sistEndret
          properties:
            status:
              type: string
              enum: [Avsluttet]
            rettighetsperioder:
              description: Alle rettighetsperioder i saken, sortert på fraOgMed, inkludert perioder uten rett (pause)
              type: array
              items:
                $ref: '#/components/schemas/Rettighetsperiode'
            opplysninger:
              description: Periodiserte opplysninger. Kun med include=opplysninger
              $ref: '#/components/schemas/Opplysninger'
            beregninger:
              description: Beregninger per dag. Kun med include=beregninger
              type: array
              items:
                $ref: '#/components/schemas/BeregnetDag'
            sistEndret:
              type: string
              format: date-time

    Gjenstaaende:
      description: Gjenstående dager i rettigheten
      type: object
      properties:
        dager:
          description: Antall gjenstående dager med rett på dagpenger
          type: integer
        sanksjon:
          description: Antall gjenstående dager med sanksjon
          type: integer
        tidsbegrensetBortfall:
          description: Antall gjenstående dager med tidsbegrenset bortfall
          type: integer

    Opplysninger:
      description: |-
        Opplysninger som endrer seg over tid. Formen avhenger av om `dato` er oppgitt:
        `Perioder` uten dato (alle perioder), `PaaDato` med dato (én verdi per opplysning).
      oneOf:
        - $ref: '#/components/schemas/OpplysningerPerioder'
        - $ref: '#/components/schemas/OpplysningerPaaDato'
      discriminator:
        propertyName: visning
        mapping:
          Perioder: '#/components/schemas/OpplysningerPerioder'
          PaaDato: '#/components/schemas/OpplysningerPaaDato'

    OpplysningerPerioder:
      type: object
      required:
        - visning
        - antallBarn
        - dagsats
        - fastsattVanligArbeidstid
